<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Maple Werx. Coming soon." />
    <meta name="theme-color" content="#ffffff" />
    <title>Maple Werx — Coming Soon</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #fff; }
      body {
        margin: 0;
        color: #202020;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
      }
      .logo {
        display: block;
        width: min(640px, 80vw);
        height: auto;
        object-fit: contain;
        margin-bottom: 0;
      }
      .loading-bar {
        width: min(240px, 70vw);
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #ededed;
      }
      .loading-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #252525;
        animation: loading 2.8s ease-in-out infinite;
      }
      p {
        margin: 12px 0 0;
        color: #777;
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: 0.06em;
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="./maple-werx-logo.png" alt="Maple Werx" />
      <div class="loading-bar" aria-hidden="true"></div>
      <p>coming soon...</p>
    </main>
  </body>
</html>
